<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Код подтверждения АбитШерпа</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F8FAFC; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8FAFC; padding: 40px 0;">
    <tr>
      <td align="center">
        <!-- Главный белый контейнер -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px; background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
          
          <!-- Шапка с логотипом -->
          <tr>
            <td align="center" style="padding: 32px 32px 0 32px;">
              <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width: 32px; height: 32px; border-radius: 8px; text-align: center; vertical-align: middle; font-weight: bold; font-size: 18px;">
                    <img src="../uploads/Logo/abitLogo.png" alt="" style="width: 32px; height: 40px; border-radius: 8px;">
                  </td>
                  <td style="padding-left: 10px; font-size: 22px; font-weight: 700; color: #1E293B;">
                    АбитШерпа
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Основной контент -->
          <tr>
            <td align="center" style="padding: 24px 32px;">
              <h2 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 600; color: #1E293B;">Вход в систему</h2>
              <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 24px; color: #475569;">
                Вы запросили вход в платформу. Пожалуйста, используйте следующий проверочный код:
              </p>
              
              <!-- Плашка с кодом -->
              <div style="background-color: #EEF2FF; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 24px;">
                <span style="font-family: monospace; font-size: 38px; font-weight: 700; letter-spacing: 12px; color: #4F46E5;">
                  {{CODE}}
                </span>
              </div>
              
              <p style="margin: 0; font-size: 14px; line-height: 20px; color: #64748B;">
                Код действителен в течение 10 минут. Если вы не запрашивали вход, просто проигнорируйте это письмо.
              </p>
            </td>
          </tr>

          <!-- Подвал -->
          <tr>
            <td align="center" style="padding: 0 32px 32px 32px;">
              <div style="border-top: 1px solid #E2E8F0; padding-top: 24px;">
                <p style="margin: 0; font-size: 12px; color: #94A3B8;">
                  © 2026 АбитШерпа. Помогаем подниматься на вершину гор.
                </p>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
